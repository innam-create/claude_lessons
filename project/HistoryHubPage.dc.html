<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/snc-museum-design-system-42b720aa-6f4e-4adb-ad53-66fb6593e8fe/colors_and_type.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Handjet:wght@400;500;600;700&display=swap">
<style>
  @font-face { font-family:'Retroville'; src:url('fonts/Retroville_NC.ttf') format('truetype'); font-weight:400 700; font-display:swap; }
  html,body{margin:0;padding:0;}
  body{background:#000;color:#D7D7D7;font-family:'Golos Text',system-ui,sans-serif;}
</style>
</helmet>
<div style="width:100%; background:#000;">
  <dc-import name="Header" variant="{{ variant }}" crt="false" active="Історія" hint-size="100%,88px"></dc-import>

  <div style="max-width:1180px; margin:0 auto; padding:0 28px; box-sizing:border-box;">
    <div style="font-family:'IBM Plex Mono',monospace; font-size:12px; color:#A8A8A8; padding:20px 0 0; letter-spacing:.04em;">
      <a href="HomePage.dc.html" style="color:#A8A8A8; text-decoration:none;">Головна</a><span style="color:#444; margin:0 8px;">/</span><span style="color:#00FFFF;">Історія</span>
    </div>
    <div style="padding:22px 0 8px; border-bottom:1px solid #1c1c1c;">
      <h1 style="font-family:'Retroville','Handjet',monospace; font-weight:700; font-size:46px; color:#fff; text-transform:uppercase; margin:0; line-height:1;">Історія</h1>
      <p style="font-size:19px; line-height:1.65; color:#D7D7D7; margin:18px 0 22px; max-width:720px;">Від задуму Клайва Сінклера до кінця епохи 8-бітних машин. Дванадцять років, що змінили те, як мільйони людей уперше зустрілися з комп'ютером.</p>
    </div>
  </div>

  <!-- TIMELINE -->
  <div style="max-width:1180px; margin:0 auto; padding:34px 28px; box-sizing:border-box;">
    <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.16em; color:#A8A8A8; margin-bottom:22px;">1980 — 1992</div>
    <div style="{{ timelineWrapStyle }}">
      <sc-for list="{{ timeline }}" as="t" hint-placeholder-count="7">
        <div style="{{ t.itemStyle }}">
          <div style="{{ t.nodeRowStyle }}">
            <div style="width:16px; height:16px; background:#000; border:3px solid #fff; flex:none;"></div>
            <div style="{{ t.lineStyle }}"></div>
          </div>
          <div style="font-family:'Retroville','Handjet',monospace; font-size:22px; color:#00FFFF; text-transform:uppercase; margin:12px 0 6px;">{{ t.year }}</div>
          <div style="font-size:15px; color:#D7D7D7; line-height:1.5;">{{ t.event }}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- LONGREAD CARDS -->
  <div style="max-width:1180px; margin:0 auto; padding:12px 28px 56px; box-sizing:border-box;">
    <h2 style="font-family:'Retroville','Handjet',monospace; font-weight:700; font-size:26px; color:#fff; text-transform:uppercase; margin:0 0 20px;">Статті</h2>
    <div style="{{ cardsStyle }}">
      <sc-for list="{{ articles }}" as="a" hint-placeholder-count="4">
        <a href="{{ a.href }}" style="display:block; border:2px solid #2a2a2a; background:#0a0a0a; text-decoration:none;" style-hover="border-color:#FFFF00;">
          <div style="aspect-ratio:16/8; border-bottom:1px solid #1c1c1c; position:relative; overflow:hidden; background:#0d0d0d;">
            <x-import component-from-global-scope="image-slot" from="./image-slot.js" id="{{ a.slotId }}" shape="rect" fit="cover" src="{{ a.img }}" credit="{{ a.credit }}" credit-href="{{ a.creditHref }}" placeholder="{{ a.placeholder }}" hint-size="100%,100%"></x-import>
            <span style="position:absolute; top:0; left:0; display:flex; height:6px; width:56px; z-index:2;"><span style="flex:1;background:#FF0000;"></span><span style="flex:1;background:#FFFF00;"></span><span style="flex:1;background:#00FF00;"></span><span style="flex:1;background:#00FFFF;"></span></span>
          </div>
          <div style="padding:16px 18px 20px;">
            <div style="font-family:'IBM Plex Mono',monospace; font-size:12px; color:#00FFFF; margin-bottom:10px;">{{ a.meta }}</div>
            <div style="font-size:18px; font-weight:600; color:#fff; line-height:1.3; margin-bottom:8px;">{{ a.title }}</div>
            <div style="font-size:14px; color:#A8A8A8; line-height:1.5;">{{ a.snippet }}</div>
          </div>
        </a>
      </sc-for>
    </div>
  </div>

  <dc-import name="Footer" hint-size="100%,260px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:820},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const variant = this.props.variant || 'desktop';
    const isMobile = variant === 'mobile';

    const timelineWrapStyle = isMobile
      ? { display: 'flex', flexDirection: 'column', gap: '0' }
      : { display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: '0' };

    const tl = [
      { year: '1980', event: 'Sinclair ZX80 — перший масовий домашній комп\u2019ютер компанії.' },
      { year: '1981', event: 'ZX81 закріплює успіх: дешевий і доступний.' },
      { year: '1982', event: 'Виходить ZX Spectrum — колір, звук, легенда.' },
      { year: '1984', event: 'ZX Spectrum+ зі «справжньою» клавіатурою.' },
      { year: '1985', event: 'ZX Spectrum 128 — більше пам\u2019яті та звуковий чип.' },
      { year: '1986', event: 'Amstrad купує права; виходить +2 з касетником.' },
      { year: '1992', event: 'Виробництво згортається — кінець епохи.' },
    ];
    const timeline = tl.map((t, i) => ({
      year: t.year, event: t.event,
      itemStyle: isMobile
        ? { padding: '0 0 26px 22px', borderLeft: '3px solid #1c1c1c', position: 'relative' }
        : { paddingRight: '14px' },
      nodeRowStyle: isMobile
        ? { position: 'absolute', left: '-9px', top: '0' }
        : { display: 'flex', alignItems: 'center' },
      lineStyle: isMobile
        ? { display: 'none' }
        : { flex: 1, height: '3px', background: i === tl.length - 1 ? 'transparent' : 'linear-gradient(90deg,#FF0000,#FFFF00,#00FF00,#00FFFF)' },
    }));

    const cardsStyle = { display: 'grid', gridTemplateColumns: isMobile ? '1fr' : 'repeat(3,1fr)', gap: '16px' };

    const articles = [
      { meta: '1982 · Залізо', title: 'Чому саме 48 кілобайт', snippet: 'Як обсяг пам\u2019яті визначив ринок домашніх машин.', href: 'Лонгрід-48k.dc.html',
        slotId: 'hist-art-48k', img: 'assets/zx-48k.jpg', credit: 'Bill Bertram · CC BY-SA 2.5 · Wikimedia', creditHref: 'https://commons.wikimedia.org/wiki/File:ZXSpectrum48k.jpg', placeholder: 'Фото ZX Spectrum 48K' },
      { meta: 'Культура', title: 'Ритуал завантаження з касети', snippet: 'Скрип, писк і смуги на екрані — знайомі кожному.', href: 'Лонгрід-касета.dc.html',
        slotId: 'hist-art-tape', img: 'assets/cassette.jpg', credit: 'BASF · CC BY-SA · Wikimedia', creditHref: 'https://commons.wikimedia.org/wiki/File:CompactCassetteBASF1973.jpg', placeholder: 'Фото касети' },
      { meta: '1981 · Попередник', title: 'ZX81: машина, що проклала шлях', snippet: 'Дешевий і масовий — саме він підготував успіх Spectrum.', href: 'Лонгрід-zx81.dc.html',
        slotId: 'hist-art-zx81', img: 'assets/zx81.jpg', credit: 'Evan-Amos · Public domain · Wikimedia', creditHref: 'https://commons.wikimedia.org/wiki/File:Sinclair_ZX81.jpg', placeholder: 'Фото Sinclair ZX81' },
    ];

    return { variant, timelineWrapStyle, timeline, cardsStyle, articles };
  }
}
</script>
</body>
</html>
