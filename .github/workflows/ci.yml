# ТЗ §2: CI блокує технічні порушення (невалідна розмітка, неповні ліцензійні
# поля), але НЕ оцінює достовірність — це робить відповідальна особа музею в ревʼю.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Перевірка типів і збірка
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Версія Node береться з .nvmrc (ТЗ §3: ≥ 22.12) — єдине джерело істини
      # для локальної розробки, CI і хостингу. Пін = 24: скрипти запускаються як
      # `node scripts/*.ts` і тягнуть спільний src/lib/licenses.ts (TypeScript),
      # тож потрібне зняття типів без прапорця (unflagged) — воно є з Node 22.18/24,
      # але НЕ в 22.12 (там `node file.ts` падає ще до перевірки). Не знижувати нижче.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Встановити залежності
        run: npm ci

      # ТЗ §7.2: тверде правило — жодне зображення без license/author/source_url/
      # accessed. Йде перед збіркою: ліцензійне порушення має валити PR одразу
      # й зрозумілим повідомленням, а не стектрейсом Zod із середини astro build.
      - name: Перевірка ліцензій зображень
        run: npm run check:licenses

      # Astro 7 має суворіший Rust-компілятор: незакриті теги — помилка збірки,
      # а не тихе виправлення (ТЗ §3, ризик R6). Ловимо це на кожному PR.
      - name: Перевірка типів і розмітки
        run: npm run check

      - name: Збірка
        run: npm run build

  e2e:
    name: E2E-тести (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Встановити залежності
        run: npm ci

      # Лише Chromium + системні залежності — конфіг ганяє один проєкт chromium.
      - name: Встановити браузер Playwright
        run: npx playwright install --with-deps chromium

      # webServer у playwright.config.ts сам робить build+preview (з Pagefind),
      # тож окремий крок збірки тут не потрібен — тести стартують із чистого дерева.
      - name: E2E-тести
        run: npm run test

      - name: Звіт Playwright (артефакт)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
