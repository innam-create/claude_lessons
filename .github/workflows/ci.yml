# ТЗ §2: CI блокує технічні порушення (невалідна розмітка, неповні ліцензійні
# поля), але НЕ оцінює достовірність — це робить відповідальна особа музею в ревʼю.
#
# ТЗ §12 (етап 3): сюди додається крок перевірки ліцензій зображень — збірка має
# падати, якщо в будь-якому записі images[] бракує license/author/source_url/accessed.
# Він з'явиться разом із переходом даних на структуроване images[] (HANDOFF §7 A.1).

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Перевірка типів і збірка
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Версія Node береться з .nvmrc (ТЗ §3: ≥ 22.12) — єдине джерело істини
      # для локальної розробки, CI і хостингу.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Встановити залежності
        run: npm ci

      # Astro 7 має суворіший Rust-компілятор: незакриті теги — помилка збірки,
      # а не тихе виправлення (ТЗ §3, ризик R6). Ловимо це на кожному PR.
      - name: Перевірка типів і розмітки
        run: npm run check

      - name: Збірка
        run: npm run build
