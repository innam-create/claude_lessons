<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/snc-museum-design-system-42b720aa-6f4e-4adb-ad53-66fb6593e8fe/colors_and_type.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=VT323&family=IBM+Plex+Mono:wght@400;500;600&family=Handjet:wght@400;500;600;700&display=swap">
<style>
  @font-face { font-family:'Retroville'; src:url('fonts/Retroville_NC.ttf') format('truetype'); font-weight:400 700; font-display:swap; }
  html,body{margin:0;padding:0;}
  body{background:#000;color:#D7D7D7;font-family:'Golos Text',system-ui,sans-serif;}
</style>
</helmet>
<div style="width:100%; background:#000;">
  <dc-import name="Header" variant="{{ variant }}" crt="false" active="" hint-size="100%,88px"></dc-import>
  <div style="max-width:820px; margin:0 auto; padding:70px 28px 90px; box-sizing:border-box; text-align:center;">
    <!-- ZX loading error stripes -->
    <div style="border:2px solid #333; overflow:hidden;">
      <div style="height:120px; background:repeating-linear-gradient(90deg,#FF0000 0 26px,#00FFFF 26px 52px,#FFFF00 52px 78px,#0000FF 78px 104px);"></div>
      <div style="background:#000; padding:26px 22px;">
        <div style="font-family:'VT323','IBM Plex Mono',monospace; font-size:26px; color:#00FF00; line-height:1.3;">R Tape loading error, 0:1</div>
        <div style="font-family:'VT323','IBM Plex Mono',monospace; font-size:22px; color:#00FF00; opacity:.8; margin-top:6px;">Program: SPECTRUM-MUSEUM</div>
      </div>
    </div>
    <div style="font-family:'Retroville','Handjet',monospace; font-weight:700; font-size:64px; color:#fff; text-transform:uppercase; margin:34px 0 0; line-height:1;">404</div>
    <div style="font-family:'Retroville','Handjet',monospace; font-weight:600; font-size:24px; color:#FFFF00; text-transform:uppercase; margin-top:12px;">Сторінку не знайдено</div>
    <p style="font-size:18px; line-height:1.65; color:#A8A8A8; margin:18px auto 30px; max-width:460px;">Схоже, касета не завантажилась. Спробуй перемотати назад — або повернутися на головну.</p>
    <div style="display:flex; gap:14px; justify-content:center; flex-wrap:wrap;">
      <a href="HomePage.dc.html" style="font-family:'Retroville','Handjet',monospace; font-weight:600; font-size:15px; text-transform:uppercase; background:#FFFF00; color:#000; padding:14px 26px; text-decoration:none;">На головну</a>
      <a href="CatalogPage.dc.html" style="font-family:'Retroville','Handjet',monospace; font-weight:600; font-size:15px; text-transform:uppercase; background:transparent; color:#00FFFF; border:2px solid #00FFFF; padding:12px 24px; text-decoration:none;">До моделей</a>
    </div>
  </div>
  <dc-import name="Footer" hint-size="100%,260px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:700},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() { return { variant: this.props.variant || 'desktop' }; }
}
</script>
</body>
</html>
