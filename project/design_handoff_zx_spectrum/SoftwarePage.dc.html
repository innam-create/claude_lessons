<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/snc-museum-design-system-42b720aa-6f4e-4adb-ad53-66fb6593e8fe/colors_and_type.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Handjet:wght@400;500;600;700&display=swap">
<style>
  @font-face { font-family:'Retroville'; src:url('fonts/Retroville_NC.ttf') format('truetype'); font-weight:400 700; font-display:swap; }
  html,body{margin:0;padding:0;}
  body{background:#000;color:#D7D7D7;font-family:'Golos Text',system-ui,sans-serif;}
</style>
</helmet>
<div style="width:100%; background:#000;">
  <dc-import name="Header" variant="{{ variant }}" crt="false" active="Софт" hint-size="100%,88px"></dc-import>
  <div style="max-width:1180px; margin:0 auto; padding:0 28px; box-sizing:border-box;">
    <div style="font-family:'IBM Plex Mono',monospace; font-size:12px; color:#A8A8A8; padding:20px 0 0; letter-spacing:.04em;">
      <a href="HomePage.dc.html" style="color:#A8A8A8; text-decoration:none;">Головна</a><span style="color:#444; margin:0 8px;">/</span><span style="color:#00FFFF;">Софт та ігри</span>
    </div>
    <div style="padding:22px 0 8px; border-bottom:1px solid #1c1c1c;">
      <h1 style="font-family:'Retroville','Handjet',monospace; font-weight:700; font-size:46px; color:#fff; text-transform:uppercase; margin:0; line-height:1;">Софт та ігри</h1>
      <p style="font-size:19px; line-height:1.65; color:#D7D7D7; margin:18px 0 0; max-width:720px;">Програми та ігри, що виходили на касетах для Spectrum. Показуємо лише обкладинки та скриншоти з чистою ліцензією.</p>
    </div>
  </div>
  <div style="max-width:1180px; margin:0 auto; padding:26px 28px 56px; box-sizing:border-box;">
    <div style="{{ gridStyle }}">
      <sc-for list="{{ programs }}" as="p" hint-placeholder-count="6">
        <div style="border:2px solid #2a2a2a; background:#0a0a0a;" style-hover="border-color:#FF00FF;">
          <div style="aspect-ratio:3/4; background-color:#0d0d0d; background-image:linear-gradient(#161616 1px,transparent 1px),linear-gradient(90deg,#161616 1px,transparent 1px); background-size:16px 16px; display:flex; align-items:center; justify-content:center; position:relative;">
            <span style="font-family:'IBM Plex Mono',monospace; font-size:12px; color:#3a3a3a;">{{ p.cover }}</span>
          </div>
          <div style="font-family:'IBM Plex Mono',monospace; font-size:10px; color:#666; padding:6px 12px; border-bottom:1px solid #1c1c1c;">{{ p.credit }}</div>
          <div style="padding:14px 16px 18px;">
            <div style="display:flex; justify-content:space-between; gap:8px;">
              <span style="font-family:'IBM Plex Mono',monospace; font-size:12px; color:#FF00FF; text-transform:uppercase;">{{ p.genre }}</span>
              <span style="font-family:'IBM Plex Mono',monospace; font-size:13px; color:#00FFFF;">{{ p.year }}</span>
            </div>
            <div style="font-family:'Retroville','Handjet',monospace; font-weight:600; font-size:19px; color:#fff; text-transform:uppercase; margin:10px 0 6px; line-height:1.15;">{{ p.name }}</div>
            <div style="font-size:14px; color:#A8A8A8; line-height:1.5;">{{ p.desc }}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
  <dc-import name="Footer" hint-size="100%,260px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const variant = this.props.variant || 'desktop';
    const isMobile = variant === 'mobile';
    const gridStyle = { display: 'grid', gridTemplateColumns: isMobile ? '1fr 1fr' : 'repeat(4,1fr)', gap: '16px' };
    const programs = [
      { name: 'Manic Miner', genre: 'Платформер', year: '1983', cover: 'обкладинка', credit: 'Bug-Byte · fair use', desc: 'Легендарний платформер Метью Сміта.' },
      { name: 'Jet Set Willy', genre: 'Платформер', year: '1984', cover: 'обкладинка', credit: 'Software Projects · fair use', desc: 'Продовження Manic Miner, велетенський особняк.' },
      { name: 'Sinclair BASIC', genre: 'Система', year: '1982', cover: 'скриншот', credit: 'Sinclair · CC BY-SA 4.0', desc: 'Вбудована мова програмування Spectrum.' },
      { name: 'Elite', genre: 'Космосим', year: '1985', cover: 'обкладинка', credit: 'невідомо · уточнюється', desc: 'Відкритий космос і торгівля у 8 бітах.' },
      { name: 'Chuckie Egg', genre: 'Аркада', year: '1983', cover: 'скриншот', credit: 'A&F Software · fair use', desc: 'Класична аркада про збирання яєць.' },
      { name: 'Horace', genre: 'Аркада', year: '1982', cover: 'обкладинка', credit: 'невідомо · уточнюється', desc: 'Серія ігор про персонажа Horace.' },
    ];
    return { variant, gridStyle, programs };
  }
}
</script>
</body>
</html>
